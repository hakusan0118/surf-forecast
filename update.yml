name: Update Surf Forecast

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update forecast data
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python update_forecast.py

      - name: Commit updated data
        run: |
          git config user.name "surf-forecast-bot"
          git config user.email "surf-forecast-bot@users.noreply.github.com"
          git add data/surf_forecast.json
          if git diff --cached --quiet; then
            echo "No forecast changes"
          else
            git commit -m "Update surf forecast"
            git push
          fi
